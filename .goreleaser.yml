version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: gooDrive

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Mark pre-releases (beta, alpha, rc) appropriately
release:
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## gooDrive {{.Version}}
    
    Welcome to this release of gooDrive - A powerful Google Drive CLI tool!
    
    ### Installation
    
    Download the appropriate binary for your platform below, extract it, and add it to your PATH.
    
    Or install using Go:
    ```bash
    go install github.com/mayura-andrew/goodrive@{{.Tag}}
    ```
